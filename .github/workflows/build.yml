name: Build, test, release

on:
  push:
    branches: [ gtrace ]
    tags:
      - '*'
  pull_request:
    branches: [ gtrace ]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: ext

jobs:
  validate-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Validate extension version metadata
        run: |
          python3 .github/scripts/validate-ext-version.py

  linux:
    needs: validate-metadata
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # 2.37.0
        with:
          php-version: ${{ matrix.php }}
      - name: Build
        run: |
          phpize
          ./configure
          make
      - name: Test
        env:
          TEST_PHP_ARGS: "-q" #do not try to submit failures
        run: make test TESTS=--show-diff

  macos:
    needs: validate-metadata
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.2', '8.3', '8.4' ]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # 2.37.0
        with:
          php-version: ${{ matrix.php }}

      - name: build
        run: |
          phpize
          ./configure
          make

      - name: test
        env:
          TEST_PHP_ARGS: "-q" #do not try to submit failures
        run: make test TESTS=--show-diff

  pecl-package:
    needs: validate-metadata
    runs-on: ubuntu-latest
    container:
      image: php:8.5-cli@sha256:f13d143eb7a29dd41758a6473f297ee0aaf18b10303818c2caa59c021165e9fe
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install zip
        run: |
          apt-get update
          apt-get install -y zip
          rm -rf /var/lib/apt/lists/*

      - name: Package and copy
        run: |
          mkdir -p binaries artifacts/opentelemetry-pecl
          pear package-validate
          pear package
          cp opentelemetry-*.tgz binaries/
          cp opentelemetry-*.tgz artifacts/opentelemetry-pecl/
      - name: Create PECL zip
        run: |
          cd artifacts
          zip -jr opentelemetry-pecl.zip opentelemetry-pecl
      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opentelemetry-pecl
          path: ext/artifacts/opentelemetry-pecl.zip
          if-no-files-found: error

  windows:
    needs: validate-metadata
    runs-on: windows-2025
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
        ts: ['ts', 'nts']
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install PHP ${{ matrix.php }}-${{ matrix.ts }}
        id: setup-php-sdk
        uses: php/setup-php-sdk@e2ce1c294f272ed93e8083f14649f5adadf93788 # v0.12
        with:
          version: ${{ matrix.php }}
          arch: x64
          ts: ${{ matrix.ts }}
      - name: Install dependencies
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
          toolset: ${{ steps.setup-php-sdk.outputs.toolset }}
      - name: Build
        run: |
          phpize
          ./configure --enable-opentelemetry --with-prefix=${{ steps.setup-php-sdk.outputs.prefix }}
          nmake
      - name: Test
        env:
          TEST_PHP_ARGS: "-q"
        run: nmake test TESTS=--show-diff
      - name: Get Compiler Version + Build Name
        shell: bash
        run: |
          case "$VisualStudioVersion" in
            16.*) COMPILER="vs16";;
            17.*) COMPILER="vs17";;
            *) echo "Unknown MSVC version: $VisualStudioVersion"; exit 1;;
          esac
          echo "Detected Compiler: $COMPILER"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          else
            RELEASE_VERSION="${GITHUB_SHA::7}"
          fi
          BUILD_NAME="php_opentelemetry-${RELEASE_VERSION}-${{matrix.php}}-${{matrix.ts}}-$COMPILER-x86_64"
          echo "Build Name: $BUILD_NAME"
          echo "BUILD_NAME=$BUILD_NAME" >> $GITHUB_ENV

      - name: Rename and copy binaries
        run: |
          md binaries\${{env.BUILD_NAME}}
          $file = Get-ChildItem -Path x64 -Recurse -Filter php_opentelemetry.dll
          Copy-Item -Path $file.FullName -Destination "binaries\${{env.BUILD_NAME}}\${{env.BUILD_NAME}}.dll"
      - name: Zip binaries
        run: |
          Compress-Archive -Path "binaries\${{env.BUILD_NAME}}\*" -DestinationPath "binaries\${{env.BUILD_NAME}}.zip" -Force
      - name: Find
        run: |
          Get-ChildItem -Path binaries -Recurse -Force | ForEach-Object { $_.FullName }
      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{env.BUILD_NAME}}
          path: ext\binaries\${{env.BUILD_NAME}}.zip
          if-no-files-found: error

  release-if-tag:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [validate-metadata, linux, macos, pecl-package, windows]
    permissions:
      contents: write # required for creating releases
    continue-on-error: false
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: download-artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: ext/artifacts
      - name: Collect assets
        run: |
          mkdir -p final-assets
          find artifacts -type f -name '*.zip' -exec cp {} final-assets/ \;
          ls -lah final-assets
      - name: Generate checksums
        run: |
          cd final-assets
          sha256sum *.zip > SHA256SUMS
      - name: Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          generate_release_notes: true
          draft: true
          files: |
            ext/final-assets/*.zip
            ext/final-assets/SHA256SUMS
